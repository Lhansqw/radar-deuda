# Empaquetado e instalador (fase 12). Uso: npm run dist (desde la raíz del repositorio).
#
# La aplicación ya viene empaquetada por esbuild y Vite en dist/ (sin node_modules
# en tiempo de ejecución): aquí solo se mete en un ASAR, se endurece el binario
# de Electron con sus fuses y se genera el instalador.
appId: io.github.lhansqw.radardeuda
productName: Radar de Deuda Técnica
executableName: radar-deuda
copyright: © 2026 Lhansqw

directories:
  buildResources: build
  output: release

files:
  - package.json
  - dist/**/*
  - '!dist/**/*.map'
  - '!dist/THIRD_PARTY_LICENSES.txt'
# Junto al ejecutable, con las licencias de Electron y Chromium que añade electron-builder.
extraFiles:
  - from: dist/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  # La licencia del propio proyecto (MIT).
  - from: ../../LICENSE
    to: LICENSE.txt

asar: true
# Sin actualizaciones automáticas: la aplicación solo avisa de versiones nuevas, que
# publica .github/workflows/release.yml en GitHub Releases (ver docs/INSTALADOR.md).
publish: null
# Nada que compilar: la aplicación no tiene módulos nativos (SQLite viene con Node).
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Fuses de Electron: se escriben en el binario y no se pueden cambiar sin
# romper la firma. Ver docs/INSTALADOR.md.
electronFuses:
  # El ejecutable nunca se comporta como un Node normal (ELECTRON_RUN_AS_NODE).
  runAsNode: false
  # Sin NODE_OPTIONS ni NODE_EXTRA_CA_CERTS, ni --inspect o SIGUSR1 para depurar el proceso principal.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Solo se carga la aplicación desde app.asar, y solo si su contenido coincide con el hash del ejecutable.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Cookies cifradas con el sistema (la aplicación no usa cookies, pero no cuesta nada).
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
  loadBrowserProcessSpecificV8Snapshot: false
  # macOS: escribir los fuses invalida la firma; se vuelve a firmar ad-hoc para que
  # Apple Silicon la abra aunque no haya certificado (con certificado se firma después).
  resetAdHocDarwinSignature: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # La firma es opcional: se activa sola con WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # (certificado .pfx) o con la configuración de Azure Trusted Signing. Sin ellas,
  # el instalador no va firmado y Windows SmartScreen avisará al abrirlo.
  signAndEditExecutable: true

nsis:
  # Instalación para el usuario actual, sin permisos de administrador.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Radar de Deuda Técnica
  installerLanguages: [es_ES]
  language: '3082'
  # Página de la licencia (MIT) antes de instalar.
  license: ../../LICENSE
  # Desinstalar no borra los proyectos, el historial ni las credenciales (%APPDATA%\radar-deuda).
  deleteAppDataOnUninstall: false
  artifactName: radar-deuda-${version}-instalador-windows-x64.${ext}

# Linux: AppImage (un archivo que funciona en casi cualquier distribución) y .deb
# (Debian y Ubuntu, con acceso en el menú, el perfil de AppArmor y el sandbox de
# Chromium configurados al instalar). Ver docs/INSTALADOR.md.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  synopsis: Detecta y gestiona la deuda técnica de tus repositorios
  maintainer: Lhansqw <timi101mu@gmail.com>
  artifactName: radar-deuda-${version}-linux-${arch}.${ext}

deb:
  # Las de electron-builder por defecto, más git (el análisis lo usa) y su llavero (libsecret).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git

# macOS: un .dmg para Apple Silicon y otro para Intel. Sin certificado de Apple
# la firma es ad-hoc (obligatoria en Apple Silicon) y macOS pide confirmación la
# primera vez que se abre. Con CSC_LINK y CSC_KEY_PASSWORD (certificado
# «Developer ID Application») se firma de verdad, y con APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID además se notariza.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Con certificado: hardened runtime (requisito para notarizar). Sin certificado,
  # scripts/dist.ts firma ad-hoc y sin hardened runtime.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true

dmg:
  artifactName: radar-deuda-${version}-macos-${arch}.${ext}
